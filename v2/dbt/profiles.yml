# How dbt connects to PostgreSQL. No passwords here: every value comes from
# the same PG* environment variables the Python scripts use.
#
# The models are created in the "reporting" schema, next to "ops".

shawarma_classic:
  target: default
  outputs:
    default:
      type: postgres
      host: "{{ env_var('PGHOST', 'localhost') }}"
      port: "{{ env_var('PGPORT', '5432') | int }}"
      user: "{{ env_var('PGUSER', 'postgres') }}"
      password: "{{ env_var('PGPASSWORD', '') }}"
      dbname: "{{ env_var('PGDATABASE', 'shawarma_classic') }}"
      schema: reporting
      threads: 1
