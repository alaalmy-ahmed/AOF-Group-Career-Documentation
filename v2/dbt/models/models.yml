# What each model means, column by column, and the checks dbt runs on the
# real data every time it builds (data_tests). A check fails if it finds any
# row that breaks it.

models:
  - name: branch_daily
    description: >
      One row per branch per day with tasks: tasks due, missed and submitted,
      the submission rate, and quality issues, with the manager who ran the
      branch that month.
    data_tests:
      # One row per branch per day
      - unique:
          column_name: "task_date || ' ' || branch_code"
    columns:
      - name: task_date
        data_tests: [not_null]
      - name: branch_code
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: source('ops', 'branches')
                field: code
      - name: manager
        description: The branch's manager that month (ops.branch_managers)
        data_tests: [not_null]
      - name: tasks_due
        description: Scheduled tasks that day. Every branch is due every task.
      - name: tasks_missed
      - name: tasks_submitted
      - name: submission_rate
        description: >
          100 - missed / due * 100, rounded to 1 decimal. For a week or a month,
          add up the counts and divide; don't average this column.
      - name: quality_issues

  - name: branch_weekly_ranking
    description: >
      The weekly branch ranking for every Wednesday-Tuesday week (docs/metrics.md).
      weekly_ranking.py writes one week of it to Excel.
    data_tests:
      # One row per branch per week
      - unique:
          column_name: "week_end || ' ' || branch_code"
    columns:
      - name: week_end
        description: The Tuesday that ends the week
        data_tests: [not_null]
      - name: manager
        description: The branch's manager on the week's last day
        data_tests: [not_null]
      - name: done_rate
      - name: branches_rank
        description: 1 = best. Ties share a rank, and the next rank is skipped.
        data_tests: [not_null]
      - name: completion_grade
        description: Excellent above 0.95, Good above 0.90, Fair above 0.80, Bad above 0.70, then Terrible
        data_tests:
          - accepted_values:
              arguments:
                values: ["Excellent", "Good", "Fair", "Bad", "Terrible"]
      - name: score
        description: Rounded to 4 decimals for reading. The rank and grade use the exact score.

  - name: manager_weekly_ranking
    description: The weekly manager ranking, from branch_weekly_ranking
    data_tests:
      - unique:
          column_name: "week_end || ' ' || manager"
    columns:
      - name: managers_rank
        data_tests: [not_null]
      - name: completion_grade
        description: From the manager's score, with the branches' thresholds (since step 9)
        data_tests:
          - accepted_values:
              arguments:
                values: ["Excellent", "Good", "Fair", "Bad", "Terrible"]

  - name: weekly_kpis
    description: >
      The two KPIs for all branches together, one row per Wednesday-Tuesday
      week. The weekly dashboard's headline numbers (step 9).
    columns:
      - name: week_end
        description: The Tuesday that ends the week
        data_tests: [unique, not_null]
      - name: tasks_due
        description: Every branch's tasks added up (each branch is due every task)
      - name: submission_rate
        description: 100 - missed / due * 100 for the whole week, rounded to 1 decimal
        data_tests: [not_null]
      - name: quality_issues

  - name: branch_meal_weekly
    description: >
      Each branch's meals, week by week: tasks due, missed, and quality issues.
      The weekly dashboard lists the meals with a problem under each branch.
    data_tests:
      # One row per branch per meal per week
      - unique:
          column_name: "week_end || ' ' || branch_code || ' ' || meal"
    columns:
      - name: week_end
        data_tests: [not_null]
      - name: tasks_due
        description: The meal's tasks that week. Every branch is due every task.
      - name: tasks_missed
      - name: quality_issues

  - name: issue_descriptions_weekly
    description: >
      How many times each quality issue description came up for a branch's
      meal, week by week. The weekly dashboard lists them under the meal.
    data_tests:
      # One row per branch, meal, description and week
      - unique:
          column_name: "week_end || ' ' || branch_code || ' ' || meal || ' ' || description"
    columns:
      - name: description
        description: From the Fixed Choices list
        data_tests: [not_null]
      - name: issues

  - name: missed_tasks
    description: >
      One row per missed task, with its day, due time, meal and week. The
      weekly dashboard shows the day and due time of each miss.
    data_tests:
      # One row per branch per task, like ops.task_misses
      - unique:
          column_name: "task_id || ' ' || branch_code"
    columns:
      - name: week_end
        data_tests: [not_null]
      - name: due_time
        data_tests: [not_null]

  - name: period_kpis
    description: >
      The two KPIs for all branches together, for every month, quarter and
      year (step 10): the monthly, quarterly and yearly reports' headline numbers.
    data_tests:
      - unique:
          column_name: "period || ' ' || period_start"
    columns:
      - name: period
        description: "'month', 'quarter' or 'year'"
        data_tests:
          - accepted_values:
              arguments:
                values: ["month", "quarter", "year"]
      - name: period_start
        description: The period's first day
        data_tests: [not_null]
      - name: submission_rate
        description: 100 - missed / due * 100 for the whole period, rounded to 1 decimal
        data_tests: [not_null]

  - name: branch_period_ranking
    description: >
      The branch ranking for every month, quarter and year, with the weekly
      method (step 10).
    data_tests:
      - unique:
          column_name: "period || ' ' || period_start || ' ' || branch_code"
    columns:
      - name: period
        description: "'month', 'quarter' or 'year'"
        data_tests:
          - accepted_values:
              arguments:
                values: ["month", "quarter", "year"]
      - name: period_start
        description: The period's first day
        data_tests: [not_null]
      - name: manager
        description: The branch's manager on the period's last day
        data_tests: [not_null]
      - name: branches_rank
        data_tests: [not_null]
      - name: completion_grade
        data_tests:
          - accepted_values:
              arguments:
                values: ["Excellent", "Good", "Fair", "Bad", "Terrible"]

  - name: manager_period_ranking
    description: >
      The manager ranking for every month, quarter and year (step 10). Each
      branch counts, month by month, for the manager who ran it that month.
      Its 'month' rows are step 7's monthly manager ranking.
    data_tests:
      - unique:
          column_name: "period || ' ' || period_start || ' ' || manager"
    columns:
      - name: period
        description: "'month', 'quarter' or 'year'"
        data_tests:
          - accepted_values:
              arguments:
                values: ["month", "quarter", "year"]
      - name: period_start
        description: The period's first day
        data_tests: [not_null]
      - name: branches
        description: How many different branches the manager ran in the period
      - name: branch_months
        description: Branches times months; in a month it's the same as branches
      - name: managers_rank
        data_tests: [not_null]
      - name: completion_grade
        data_tests:
          - accepted_values:
              arguments:
                values: ["Excellent", "Good", "Fair", "Bad", "Terrible"]

  - name: branch_meal_period
    description: >
      Each branch's meals for every month, quarter and year: tasks due,
      missed, and quality issues (step 10).
    data_tests:
      - unique:
          column_name: "period || ' ' || period_start || ' ' || branch_code || ' ' || meal"
    columns:
      - name: period
        description: "'month', 'quarter' or 'year'"
        data_tests:
          - accepted_values:
              arguments:
                values: ["month", "quarter", "year"]
      - name: period_start
        description: The period's first day
        data_tests: [not_null]

  - name: issue_descriptions_period
    description: >
      How many times each issue description came up for a branch's meal, for
      every month, quarter and year (step 10).
    data_tests:
      - unique:
          column_name: "period || ' ' || period_start || ' ' || branch_code || ' ' || meal || ' ' || description"
    columns:
      - name: period
        description: "'month', 'quarter' or 'year'"
        data_tests:
          - accepted_values:
              arguments:
                values: ["month", "quarter", "year"]
      - name: period_start
        description: The period's first day
        data_tests: [not_null]
      - name: description
        data_tests: [not_null]
