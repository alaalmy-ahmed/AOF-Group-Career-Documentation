# Local PostgreSQL for notebook 02. Creates the database, tables and ranking functions on first start.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: shawarma_classic
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${PGPASSWORD:-change-me}
    ports:
      - "5432:5432"
    volumes:
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./sql/ranking.sql:/docker-entrypoint-initdb.d/02_ranking.sql:ro
