# Local PostgreSQL for notebook 02. Creates the database and tables on first start.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: shawarma_classic
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${PGPASSWORD:-change-me}
    ports:
      - "5432:5432"
    volumes:
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
